<div id="server-status-container">
  <div id="glow"></div>

  <div id="server-card">
    <img id="server-icon" src="https://creatorlabs.net/wp-content/uploads/2023/12/wither.gif" alt="Wither Icon">
    
    <h1>Nether Core</h1>
    
    <p id="server-ip">play.nether-core.com</p>
    
    <p id="status">Loading...</p>
    
    <p id="players"></p>
    <p id="version">Game Version 1.21.11</p>
  </div>
</div>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
}

#server-status-container {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(135deg, #0b0b0b 0%, #1a001a 50%, #0b0b0b 100%);
}

/* 🔥 GLOW ELEMENT (this is what pulses) */
#glow {
  position: absolute;
  width: 460px;
  height: 460px;
  background: radial-gradient(circle, rgba(140,0,255,0.8) 0%, rgba(140,0,255,0.4) 40%, transparent 70%);
  filter: blur(40px);
  border-radius: 50%;
  z-index: 0;

  animation: pulse 2.5s ease-in-out infinite;
}

/* 💥 ANIMATION */
@keyframes pulse {
  0% {
    transform: scale(0.8);
    opacity: 0.4;
  }
  50% {
    transform: scale(1.2);
    opacity: 1;
  }
  100% {
    transform: scale(0.8);
    opacity: 0.4;
  }
}

/* CARD */
#server-card {
  position: relative;
  z-index: 1;
  background: rgba(0,0,0,0.9);
  padding: 40px;
  border-radius: 24px;
  text-align: center;
  width: 420px;
  color: white;
}

/* ICON */
#server-icon {
  width: 160px;
  height: 160px;
  margin-bottom: 18px;
  border-radius: 12px;
  object-fit: cover;
}

h1 {
  margin: 10px 0;
  font-size: 32px;
}

#server-ip {
  font-size: 16px;
  color: #bbb;
  margin-bottom: 10px;
  font-family: monospace;
  background: rgba(255,255,255,0.05);
  padding: 6px 10px;
  border-radius: 8px;
  display: inline-block;
}

#status {
  font-size: 20px;
  margin-top: 10px;
}

#players {
  font-size: 16px;
  color: #aaa;
  margin-top: 6px;
}

#version {
  font-size: 14px;
  color: #888;
  margin-top: 4px;
}
</style>

<script>
async function updateStatus() {
  const status = document.getElementById("status");
  const players = document.getElementById("players");

  try {
    const res = await fetch("https://api.mcsrvstat.us/2/play.nether-core.com");
    const data = await res.json();

    if (data.online) {
      status.innerHTML = "<span style='color:#00ff88;'>● Online</span>";
      players.innerText = `${data.players.online} / ${data.players.max} players online`;
    } else {
      status.innerHTML = "<span style='color:#ff4444;'>● Offline</span>";
      players.innerText = "";
    }

  } catch (e) {
    status.innerHTML = "<span style='color:#ff4444;'>● Offline</span>";
    players.innerText = "";
  }
}

updateStatus();
setInterval(updateStatus, 10000);
</script>
