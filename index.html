<div id="server-status-container">
  <div id="server-card">
    <img id="server-icon" src="https://creatorlabs.net/wp-content/uploads/2023/12/wither.gif" alt="Wither Icon">
    
    <h1>Nether Core</h1>
    
    <p id="server-ip">play.nether-core.com</p>
    
    <p id="status">Loading...</p>
    
    <p id="players"></p>
    <p id="version">Game Version 1.21.11</p>
  </div>
</div>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
}

#server-status-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(135deg, #0b0b0b 0%, #1a001a 50%, #0b0b0b 100%);
  color: white;
}

#server-card {
  background: rgba(0,0,0,0.85);
  padding: 40px;
  border-radius: 24px;
  text-align: center;
  width: 420px;

  /* PULSING GLOW */
  animation: pulseGlow 2.8s ease-in-out infinite;
}

/* GLOW ANIMATION */
@keyframes pulseGlow {
  0% {
    box-shadow:
      0 0 20px rgba(140, 0, 255, 0.5),
      0 0 40px rgba(140, 0, 255, 0.4),
      0 0 60px rgba(140, 0, 255, 0.3);
    transform: scale(1);
  }

  50% {
    box-shadow:
      0 0 45px rgba(140, 0, 255, 0.9),
      0 0 90px rgba(140, 0, 255, 0.7),
      0 0 140px rgba(140, 0, 255, 0.5);
    transform: scale(1.03);
  }

  100% {
    box-shadow:
      0 0 20px rgba(140, 0, 255, 0.5),
      0 0 40px rgba(140, 0, 255, 0.4),
      0 0 60px rgba(140, 0, 255, 0.3);
    transform: scale(1);
  }
}

/* CLEAN GIF — NO GLOW */
#server-icon {
  width: 160px;
  height: 160px;
  margin-bottom: 18px;
  border-radius: 12px;
  object-fit: cover;
  box-shadow: none;
}

h1 {
  margin: 10px 0;
  font-size: 32px;
}

#server-ip {
  font-size: 16px;
  color: #bbb;
  margin-bottom: 10px;
  font-family: monospace;
  background: rgba(255,255,255,0.05);
  padding: 6px 10px;
  border-radius: 8px;
  display: inline-block;
}

#status {
  font-size: 20px;
  margin-top: 10px;
}

#players {
  font-size: 16px;
  color: #aaa;
  margin-top: 6px;
}

#version {
  font-size: 14px;
  color: #888;
  margin-top: 4px;
}
</style>

<script>
async function updateStatus() {
  const status = document.getElementById("status");
  const players = document.getElementById("players");

  try {
    const res = await fetch("https://api.mcsrvstat.us/2/play.nether-core.com");
    const data = await res.json();

    if (data.online) {
      status.innerHTML = "<span style='color:#00ff88;'>● Online</span>";
      players.innerText = `${data.players.online} / ${data.players.max} players online`;
    } else {
      status.innerHTML = "<span style='color:#ff4444;'>● Offline</span>";
      players.innerText = "";
    }

  } catch (e) {
    status.innerHTML = "<span style='color:#ff4444;'>● Offline</span>";
    players.innerText = "";
  }
}

updateStatus();
setInterval(updateStatus, 10000);
</script>
